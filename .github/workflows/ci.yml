name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - name: Smoke-test packed package
        run: |
          set -euo pipefail
          tarball="$(pnpm pack --pack-destination "${RUNNER_TEMP}" | tail -1)"
          install_root="$(mktemp -d)"
          npm install --global --prefix "$install_root" "$tarball"
          "$install_root/bin/borealis" --version
