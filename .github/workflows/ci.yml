name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:check
      - name: Require immutable canonical catalog provenance
        id: canonical
        run: |
          set -euo pipefail
          revision="$(node scripts/catalog-provenance.mjs --revision)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out pinned canonical Borealis source
        uses: actions/checkout@v5
        with:
          repository: Amaretto-Software-Labs/borealis
          ref: ${{ steps.canonical.outputs.revision }}
          path: canonical-borealis
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BOREALIS_CATALOG_READ_TOKEN || github.token }}
      - name: Verify both catalogs against the immutable canonical revision
        env:
          BOREALIS_SOURCE_ROOT: ${{ github.workspace }}/canonical-borealis
        run: pnpm parity:canonical
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - name: Smoke-test packed package
        run: |
          set -euo pipefail
          tarball="$(pnpm pack --pack-destination "${RUNNER_TEMP}" | tail -1)"
          install_root="$(mktemp -d)"
          npm install --global --prefix "$install_root" "$tarball"
          "$install_root/bin/borealis" --version
